<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial 2026 — Predictions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a472a 0%, #2d6a4f 100%);
      padding: 20px 16px;
      text-align: center;
      border-bottom: 3px solid #40916c;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }

    nav a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }

    nav a.active {
      background: #1f6feb;
      color: #fff;
      border-color: #1f6feb;
    }

    nav a:hover:not(.active) {
      background: #21262d;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .name-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .name-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #8b949e;
    }

    .name-section input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 1rem;
    }

    .name-section input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .match-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }

    .match-card:hover {
      border-color: #58a6ff44;
    }

    .match-card.locked {
      opacity: 0.5;
      pointer-events: none;
    }

    .match-meta {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
    }

    .match-meta .stage {
      background: #21262d;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .match-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team {
      flex: 1;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .team.away {
      text-align: right;
    }

    .score-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .score-inputs input {
      width: 52px;
      padding: 8px 4px;
      text-align: center;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-inputs input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .score-inputs .sep {
      color: #8b949e;
      font-weight: 700;
    }

    .lock-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #b91c1c22;
      color: #f87171;
      border: 1px solid #b91c1c44;
      border-radius: 4px;
      padding: 2px 6px;
      margin-top: 8px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a472a, #40916c);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 999;
      animation: fadein 0.3s ease;
    }

    .toast.success {
      background: #166534;
      color: #bbf7d0;
      border: 1px solid #22c55e44;
    }

    .toast.error {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #ef444444;
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: #8b949e;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #e6edf3;
    }

    .empty-state p {
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }

    .pred-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }

    .pred-card .match-label {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .pred-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
    }

    .pred-row .pred-team {
      flex: 1;
      font-weight: 600;
    }

    .pred-row .pred-team.away {
      text-align: right;
    }

    .pred-score {
      font-size: 1.1rem;
      font-weight: 700;
      color: #58a6ff;
      min-width: 56px;
      text-align: center;
    }

    .pred-result {
      font-size: 0.72rem;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .pred-result.exact {
      background: #166534;
      color: #bbf7d0;
    }

    .pred-result.winner {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .pred-result.wrong {
      background: #4a1919;
      color: #fca5a5;
    }

    .pred-result.pending {
      background: #21262d;
      color: #8b949e;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ Mundial 2026</h1>
    <p>Submit your daily predictions</p>
  </header>

  <nav>
    <a href="index.html" class="active">Predictions</a>
    <a href="bonus.html">Bonus</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="analytics.html">Analytics</a>
  </nav>

  <main>
    <div class="name-section">
      <label for="playerName">Your name</label>
      <input type="text" id="playerName" placeholder="Enter your name..." maxlength="30" autocomplete="off">
    </div>

    <div id="matchesContainer">
      <div class="loading">Loading today's matches…</div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitPredictions()" style="display:none">
      Save Predictions
    </button>

    <div id="predictionsViewer" style="display:none; margin-top:28px">
      <div class="section-title">👁 See today's predictions</div>
      <select id="playerSelect" onchange="showPlayerPredictions()"
        style="width:100%;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:0.95rem;margin-bottom:14px">
        <option value="">Select a player…</option>
      </select>
      <div id="playerPredictionsContainer"></div>
    </div>
  </main>

  <script>
    // ⚠️ Replace this with your deployed Apps Script Web App URL
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyf9G9ot_Z4Y4OlcYSZVIY_ESrnp_MRsPMFfIDjzSMiBtKRApMLrnc9kqO81IEPMFqaPg/exec';

    let todayMatches = [];

    const savedName = localStorage.getItem('playerName');
    if (savedName) document.getElementById('playerName').value = savedName;

    document.getElementById('playerName').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const first = document.querySelector('.score-inputs input:not([disabled])');
        if (first) first.focus();
      }
    });

    async function loadMatches() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=matches`);
        const data = await res.json();
        todayMatches = data.matches || [];
        renderMatches(data.today);
      } catch (err) {
        document.getElementById('matchesContainer').innerHTML =
          `<div class="empty-state"><div class="icon">⚠️</div><h3>Could not load matches</h3><p>Check that the Web App URL is configured correctly.</p></div>`;
      }
    }

    function renderMatches(today) {
      const container = document.getElementById('matchesContainer');

      if (todayMatches.length === 0) {
        container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📅</div>
          <h3>No matches today</h3>
          <p>Come back when there are matches scheduled.<br>Check the <a href="leaderboard.html" style="color:#58a6ff">leaderboard</a> in the meantime!</p>
        </div>`;
        return;
      }

      const now = new Date();

      let html = `<div class="section-title">Today's matches — ${formatDate(today)}</div>`;

      for (const m of todayMatches) {
        const kickoff = new Date(`${m.date}T${m.time}:00`);
        const locked = now >= kickoff || m.status === 'FINISHED' || m.status === 'IN_PLAY';

        html += `
        <div class="match-card ${locked ? 'locked' : ''}" id="card-${m.matchId}">
          <div class="match-meta">
            <span class="stage">${formatStage(m.stage)}</span>
            <span>🕐 ${m.time}</span>
            ${locked ? '<span style="color:#f87171">⛔ Locked</span>' : ''}
          </div>
          <div class="match-row">
            <div class="team">${m.homeTeam}</div>
            <div class="score-inputs">
              <input type="number" min="0" max="20" id="home-${m.matchId}" placeholder="—" ${locked ? 'disabled' : ''}>
              <span class="sep">–</span>
              <input type="number" min="0" max="20" id="away-${m.matchId}" placeholder="—" ${locked ? 'disabled' : ''}>
            </div>
            <div class="team away">${m.awayTeam}</div>
          </div>
          ${locked ? '<div class="lock-badge">Predictions closed</div>' : ''}
        </div>`;
      }

      container.innerHTML = html;

      const hasOpen = todayMatches.some(m => {
        const ko = new Date(`${m.date}T${m.time}:00`);
        return now < ko && m.status !== 'FINISHED';
      });

      if (hasOpen) {
        document.getElementById('submitBtn').style.display = 'block';
      }
    }

    async function submitPredictions() {
      const playerName = document.getElementById('playerName').value.trim();
      if (!playerName) { showToast('Enter your name first!', 'error'); return; }

      localStorage.setItem('playerName', playerName);

      const now = new Date();
      const predictions = [];

      for (const m of todayMatches) {
        const kickoff = new Date(`${m.date}T${m.time}:00`);
        if (now >= kickoff) continue;

        const home = document.getElementById(`home-${m.matchId}`)?.value;
        const away = document.getElementById(`away-${m.matchId}`)?.value;
        if (home === '' || away === '') continue;

        predictions.push({ matchId: m.matchId, homeScore: home, awayScore: away });
      }

      if (predictions.length === 0) {
        showToast('No predictions to save.', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ playerName, predictions }),
        });
        const data = await res.json();

        if (data.success) {
          showToast(`✅ Saved ${data.saved} prediction${data.saved !== 1 ? 's' : ''}!`, 'success');
          btn.textContent = '✅ Saved!';
        } else {
          showToast(`Error: ${data.error}`, 'error');
          btn.disabled = false;
          btn.textContent = 'Save Predictions';
        }
      } catch (err) {
        showToast('Network error. Try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Save Predictions';
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function formatStage(stage) {
      const map = {
        GROUP_STAGE: 'Group Stage',
        ROUND_OF_32: 'Round of 32',
        LAST_16: 'Round of 16',
        QUARTER_FINALS: 'Quarter-finals',
        SEMI_FINALS: 'Semi-finals',
        FINAL: 'Final',
      };
      return map[stage] || stage;
    }

    function showToast(msg, type) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    // ---- Predictions viewer ----
    let allPredictionsData = null;

    async function loadPredictionsViewer() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=todaypredictions`);
        const data = await res.json();
        allPredictionsData = data;
        if (!data.players || data.players.length === 0) return;

        const viewer = document.getElementById('predictionsViewer');
        const sel = document.getElementById('playerSelect');
        viewer.style.display = 'block';
        data.players.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = `${name} (${(data.predictions[name] || []).length}/${data.totalMatches} matches)`;
          sel.appendChild(opt);
        });
      } catch (e) { /* silently skip */ }
    }

    function showPlayerPredictions() {
      const player = document.getElementById('playerSelect').value;
      const container = document.getElementById('playerPredictionsContainer');
      if (!player || !allPredictionsData) { container.innerHTML = ''; return; }

      const preds = allPredictionsData.predictions[player] || [];
      if (preds.length === 0) { container.innerHTML = '<p style="color:#8b949e;font-size:0.85rem">No predictions submitted yet.</p>'; return; }

      container.innerHTML = preds.map(p => {
        const finished = p.status === 'FINISHED';
        let resultHtml = '';
        if (finished && p.actualHome !== null) {
          const predW = p.predHome > p.predAway ? 'H' : p.predHome < p.predAway ? 'A' : 'D';
          const realW = p.actualHome > p.actualAway ? 'H' : p.actualHome < p.actualAway ? 'A' : 'D';
          const exact = Number(p.predHome) === p.actualHome && Number(p.predAway) === p.actualAway;
          if (exact) resultHtml = `<span class="pred-result exact">⚽ Exact! +4pts</span>`;
          else if (predW === realW) resultHtml = `<span class="pred-result winner">✓ Correct result +1pt</span>`;
          else resultHtml = `<span class="pred-result wrong">✗ Wrong (${p.actualHome}–${p.actualAway})</span>`;
        } else if (!finished) {
          resultHtml = `<span class="pred-result pending">Pending – ${p.time}</span>`;
        }
        return `
          <div class="pred-card">
            <div class="match-label">${esc(p.homeTeam)} vs ${esc(p.awayTeam)}</div>
            <div class="pred-row">
              <div class="pred-team">${esc(p.homeTeam)}</div>
              <div class="pred-score">${p.predHome} – ${p.predAway}</div>
              <div class="pred-team away">${esc(p.awayTeam)}</div>
            </div>
            ${resultHtml}
          </div>`;
      }).join('');
    }

    function esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    loadMatches();
    loadPredictionsViewer();
  </script>
</body>

</html>
